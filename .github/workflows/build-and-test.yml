name: ' ' # empty name
on: [push, pull_request, workflow_dispatch]

jobs:
  working:
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Release, Debug ]
        architecture: [ aarch64, x86_64 ]
        include:
          - architecture: aarch64
            runner: ubuntu-24.04-arm
          - architecture: x86_64
            runner: ubuntu-24.04
    runs-on: ${{matrix.runner}}
    # prepare writable volume prefix mount for actions/upload-artifact,
    # based on the higher-profile workaround for 32-bit GNU/Linux containers explained here
    # https://github.com/actions/upload-artifact/issues/616#issuecomment-2350667347
    container:
      image: termux/termux-docker:${{matrix.architecture}}
      volumes: 
        - /tmp/node20:/__e/node20
    # approximate environment variables for actions that can't be forced to use entrypoint.sh
    env:
      TERMUX_MAIN_PACKAGE_FORMAT: debian
      ANDROID_ROOT: /system
      ANDROID_DATA: /data
      PREFIX: /data/data/com.termux/files/usr
      HOME: /data/data/com.termux/files/home
      PATH: /data/data/com.termux/files/usr/bin
      TMPDIR: /data/data/com.termux/files/usr/tmp
      LANG: en_US.UTF-8
      TZ: UTC
    steps:
      - name: set pkg command to use the packages-cf.termux.dev mirror
        run: ln -sf ${PREFIX}/etc/termux/mirrors/default ${PREFIX}/etc/termux/chosen_mirrors
      - name: upgrade all packages to prepare for installing nodejs
        run: |
          /entrypoint.sh pkg update
          /entrypoint.sh bash -c "yes | pkg upgrade -y"
      # actions/checkout will "think" that termux's tar binary isn't executable if it doesn't have
      # executable bit actually set for all users, since even though that permissions restriction
      # doesn't actually apply to the root user (at least on Android), GitHub Actions' internal
      # source code doesn't "care" and would refuse to run the binary anyway.
      # relevant internal source code of GitHub Actions:
      # https://github.com/actions/toolkit/blob/930c89072712a3aac52d74b23338f00bb0cfcb24/packages/io/src/io-util.ts#L167-L177
      - name: fix executable bit for all binaries in $PREFIX/bin for all users
        run: chmod -R o+x ${PREFIX}/bin
      - name: install bionic-libc nodejs to force compatibility with actions/checkout and actions/upload-artifact
        run: |
          /entrypoint.sh pkg install -y nodejs-lts
          ln -sf ${PREFIX}/bin /__e/node20/bin
      - uses: actions/checkout@v4.2.2
      - name: fix permissions after actions/checkout, which ran as root user, while entrypoint.sh activates system user (1000)
        run: chown -R 1000:1000 .

      - name: setup
        run: /entrypoint.sh pkg install -y llvm binutils binutils libgc build-essential cmake llvm git libedit zlib clang make mlir llvm-tools libpolly python libllvm-static gdb
      - name: build
        run: |
          /entrypoint.sh git clone https://github.com/Book-reader/c3c -b fix-termux
          /entrypoint.sh mv c3c/* .
          /entrypoint.sh cmake -Bbuild -DCMAKE_BUILD_TYPE=${{matrix.build_type}}
          /entrypoint.sh make -C build -j$(nproc)

      - name: Compile and run some examples
        run: |
          cd resources
          /entrypoint.sh ../build/c3c compile examples/base64.c3
          /entrypoint.sh ../build/c3c compile examples/binarydigits.c3
          /entrypoint.sh ../build/c3c compile examples/brainfk.c3
          /entrypoint.sh ../build/c3c compile examples/factorial_macro.c3
          /entrypoint.sh ../build/c3c compile examples/fasta.c3
          /entrypoint.sh ../build/c3c compile examples/gameoflife.c3
          /entrypoint.sh ../build/c3c compile examples/hash.c3
          /entrypoint.sh ../build/c3c compile-only examples/levenshtein.c3
          /entrypoint.sh ../build/c3c compile examples/load_world.c3
          /entrypoint.sh ../build/c3c compile-only examples/map.c3
          /entrypoint.sh ../build/c3c compile examples/mandelbrot.c3
          /entrypoint.sh ../build/c3c compile examples/plus_minus.c3
          /entrypoint.sh ../build/c3c compile examples/nbodies.c3
          /entrypoint.sh ../build/c3c compile examples/spectralnorm.c3
          /entrypoint.sh ../build/c3c compile examples/swap.c3
          /entrypoint.sh ../build/c3c compile examples/contextfree/boolerr.c3
          /entrypoint.sh ../build/c3c compile examples/contextfree/dynscope.c3
          /entrypoint.sh ../build/c3c compile examples/contextfree/guess_number.c3
          /entrypoint.sh ../build/c3c compile examples/contextfree/multi.c3
          /entrypoint.sh ../build/c3c compile examples/contextfree/cleanup.c3
          /entrypoint.sh ../build/c3c compile-run examples/hello_world_many.c3
          /entrypoint.sh ../build/c3c compile-run examples/time.c3
          /entrypoint.sh ../build/c3c compile-run examples/fannkuch-redux.c3
          /entrypoint.sh ../build/c3c compile-run examples/contextfree/boolerr.c3
          /entrypoint.sh ../build/c3c compile-run examples/load_world.c3
          /entrypoint.sh ../build/c3c compile-run examples/process.c3
          /entrypoint.sh ../build/c3c compile-run examples/ls.c3
          /entrypoint.sh ../build/c3c compile-run examples/args.c3 -- foo -bar "baz baz"

      - name: Compile and run staticlib-test
        run: |
          cd resources/examples/staticlib-test
          /entrypoint.sh ../../../build/c3c -vv static-lib add.c3
          mv add.a libadd.a
          cc test.c -L. -ladd         
          ./a.out
          /entrypoint.sh ../../../build/c3c compile-run test.c3 -L . -l add

      #- name: Compile run unit tests
      #  run: |
      #    cd test
      #    ../build/c3c compile-test unit -D SLOW_TESTS

      - name: Build testproject
        run: |
          cd resources/testproject
          ../../build/c3c run -vvv --trust=full

      - name: run compiler tests
        run: |
          cd test
          /entrypoint.sh ../build/c3c compile -O1 src/test_suite_runner.c3
          gdb -q --eval-command "r" --eval-command "backtrace" --eval-command "quit" --args ./test_suite_runner ../build/c3c  test_suite/

      - name: bundle_output
        run: |
          /entrypoint.sh mkdir c3
          /entrypoint.sh cp -r lib c3
          /entrypoint.sh cp msvc_build_libraries.py c3
          /entrypoint.sh cp build/c3c c3
          /entrypoint.sh cp README.md c3
          /entrypoint.sh cp releasenotes.md c3
          /entrypoint.sh tar czf c3-android-${{matrix.architecture}}-${{matrix.build_type}}.tar.gz c3

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c3-android-${{matrix.architecture}}-${{matrix.build_type}}
          path: c3-android-${{matrix.architecture}}-${{matrix.build_type}}.tar.gz
